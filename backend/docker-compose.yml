version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wallcraft
      POSTGRES_PASSWORD: wallcraft_password
      POSTGRES_DB: wallcraft_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallcraft"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434

  backend:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://wallcraft:wallcraft_password@postgres:5432/wallcraft_ai
      JWT_SECRET: your-super-secret-key-change-in-production
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: llama3
      DEBUG: "True"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./temp:/app/temp

volumes:
  postgres_data:
  ollama_data:
